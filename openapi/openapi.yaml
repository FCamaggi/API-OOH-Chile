openapi: 3.1.0
info:
  title: API-OOH-Chile — Plataforma Geoespacial y Auditoría OOH/DOOH (RM)
  description: Plataforma API-First de Inteligencia Geoespacial, Planificación Comercial
    y Fiscalización Normativa (Ley N° 21.473) para el inventario OOH y DOOH en las
    52 comunas de la Región Metropolitana de Santiago.
  version: 1.0.0
paths:
  /v1/territories/communes:
    get:
      tags:
      - Territorios y Capas Base RM
      summary: Lista las 52 comunas de la Región Metropolitana con sus anillos y tasas
        UTM/m2
      operationId: get_rm_communes_v1_territories_communes_get
      parameters:
      - name: ring_tier
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 4
            minimum: 1
          - type: 'null'
          description: Filtrar por Anillo Operativo RM (1 a 4)
          title: Ring Tier
        description: Filtrar por Anillo Operativo RM (1 a 4)
      - name: province_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrar por provincia (Santiago, Cordillera, Chacabuco, Maipo,
            Melipilla, Talagante)
          title: Province Name
        description: Filtrar por provincia (Santiago, Cordillera, Chacabuco, Maipo,
          Melipilla, Talagante)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommuneRM'
                title: Response Get Rm Communes V1 Territories Communes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tiles/{z}/{x}/{y}.json:
    get:
      tags:
      - Territorios y Capas Base RM
      summary: Descriptor ligero de Vector Tiles (MVT) para el futuro visor cartográfico
      operationId: get_vector_tile_preview_v1_tiles__z___x___y__json_get
      parameters:
      - name: z
        in: path
        required: true
        schema:
          type: integer
          title: Z
      - name: x
        in: path
        required: true
        schema:
          type: integer
          title: X
      - name: y
        in: path
        required: true
        schema:
          type: integer
          title: Y
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Vector Tile Preview V1 Tiles  Z   X   Y  Json
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assets:
    get:
      tags:
      - Inventario Físico (Assets)
      summary: Búsqueda geoespacial y multicriterio de estructuras OOH/DOOH en las
        52 comunas RM
      operationId: search_assets_v1_assets_get
      parameters:
      - name: commune_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Código CUT comunal (ej. 13123,13114)
          title: Commune Code
        description: Código CUT comunal (ej. 13123,13114)
      - name: bbox
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: min_lng,min_lat,max_lng,max_lat
          title: Bbox
        description: min_lng,min_lat,max_lng,max_lat
      - name: near
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: lat,lng,radius_m (ej. -33.42628,-70.61094,1000)
          title: Near
        description: lat,lng,radius_m (ej. -33.42628,-70.61094,1000)
      - name: structure_category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - STREET_FURNITURE
            - LARGE_FORMAT_ROADSIDE
            - TRANSPORT_NETWORK
            - BUILDING_FACADE
            type: string
          - type: 'null'
          title: Structure Category
      - name: tech_type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - DOOH_LED
            - STATIC_BACKLIGHT
            - STATIC_PAPER
            - TRIVISION
            type: string
          - type: 'null'
          title: Tech Type
      - name: compliance_status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - VERIFIED_LEGAL
            - PARTIAL_COMPLIANCE
            - UNREGISTERED_CLANDESTINE
            - ZONING_VIOLATION_RISK
            - EXPIRED_PERMIT
            type: string
          - type: 'null'
          title: Compliance Status
      - name: media_owner_rut
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Owner Rut
      - name: format
        in: query
        required: false
        schema:
          type: string
          pattern: ^(json|geojson)$
          default: json
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/AssetRecord'
                - $ref: '#/components/schemas/GeoJSONFeatureCollection'
                title: Response Search Assets V1 Assets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assets/{asset_id}:
    get:
      tags:
      - Inventario Físico (Assets)
      summary: Obtiene la ficha maestra tricapa (Asset + Faces + Compliance) de un
        soporte físico
      operationId: get_asset_by_id_v1_assets__asset_id__get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/faces/search:
    get:
      tags:
      - Caras Publicitarias y Planificación (Faces)
      summary: Buscador de caras publicitarias para compra de medios con métricas
        OTS/VAC y tarifas netas
      operationId: search_faces_v1_faces_search_get
      parameters:
      - name: commune_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Commune Code
      - name: tech_type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - DOOH_LED
            - STATIC_BACKLIGHT
            - STATIC_PAPER
            - TRIVISION
            type: string
          - type: 'null'
          title: Tech Type
      - name: min_area_m2
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          title: Min Area M2
      - name: max_net_price_clp
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Max Net Price Clp
      - name: min_weekly_vac
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Min Weekly Vac
      - name: only_verified_legal
        in: query
        required: false
        schema:
          type: boolean
          description: Excluye activos con riesgo de responsabilidad solidaria Ley
            21.473
          default: false
          title: Only Verified Legal
        description: Excluye activos con riesgo de responsabilidad solidaria Ley 21.473
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Search Faces V1 Faces Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/compliance/discrepancies:
    get:
      tags:
      - Auditoría y Fiscalización (Ley N° 21.473)
      summary: Detecta soportes clandestinos, sin permiso DOM o con subdeclaración
        de m2 en la RM
      operationId: list_compliance_discrepancies_v1_compliance_discrepancies_get
      parameters:
      - name: commune_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Commune Code
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - VERIFIED_LEGAL
            - PARTIAL_COMPLIANCE
            - UNREGISTERED_CLANDESTINE
            - ZONING_VIOLATION_RISK
            - EXPIRED_PERMIT
            type: string
          - type: 'null'
          title: Status
      - name: ley_21473_class
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - ELEMENTO_MENOR
            - ELEMENTO_MAYOR
            type: string
          - type: 'null'
          title: Ley 21473 Class
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Compliance Discrepancies V1 Compliance Discrepancies
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/compliance/discrepancies/export:
    get:
      tags:
      - Auditoría y Fiscalización (Ley N° 21.473)
      summary: Exporta discrepancias detectadas en formato CSV
      operationId: export_compliance_discrepancies_v1_compliance_discrepancies_export_get
      parameters:
      - name: commune_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Commune Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/compliance/communes/{commune_code}/summary:
    get:
      tags:
      - Auditoría y Fiscalización (Ley N° 21.473)
      summary: Resumen ejecutivo de auditoría OOH/DOOH para una municipalidad de la
        RM
      operationId: get_commune_compliance_summary_v1_compliance_communes__commune_code__summary_get
      parameters:
      - name: commune_code
        in: path
        required: true
        schema:
          type: string
          title: Commune Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Commune Compliance Summary V1 Compliance Communes  Commune
                  Code  Summary Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/campaigns/simulate:
    post:
      tags:
      - Simulador de Campañas y Precios Netos
      summary: Simula alcance OTS/VAC, inversión neta (descuento 30-55%) y riesgo
        legal Ley 21.473
      operationId: simulate_campaign_v1_campaigns_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignSimulationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSimulationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ingestion/municipal-batch:
    post:
      tags:
      - Ingesta y Spatial Entity Resolution
      summary: Cruza un lote de registros DOM (Art. 16 Ley 21.473) o Rentas contra
        el inventario comercial
      operationId: process_municipal_batch_v1_ingestion_municipal_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalBatchIngestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Process Municipal Batch V1 Ingestion Municipal Batch
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - Sistema
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
components:
  schemas:
    AssetMetadataInfo:
      properties:
        entity_resolution_confidence:
          type: number
          title: Entity Resolution Confidence
        last_scraped_at:
          type: string
          title: Last Scraped At
        last_audited_at:
          type: string
          title: Last Audited At
        sources:
          items:
            $ref: '#/components/schemas/SourceLineageItem'
          type: array
          title: Sources
      type: object
      required:
      - entity_resolution_confidence
      - last_scraped_at
      - last_audited_at
      - sources
      title: AssetMetadataInfo
    AssetRecord:
      properties:
        asset_id:
          type: string
          title: Asset Id
        location:
          $ref: '#/components/schemas/LocationInfo'
        structure:
          $ref: '#/components/schemas/StructureInfo'
        ownership:
          $ref: '#/components/schemas/OwnershipInfo'
        faces:
          items:
            $ref: '#/components/schemas/FaceItem'
          type: array
          title: Faces
        compliance_audit:
          $ref: '#/components/schemas/ComplianceAuditInfo'
        metadata:
          $ref: '#/components/schemas/AssetMetadataInfo'
      type: object
      required:
      - asset_id
      - location
      - structure
      - ownership
      - faces
      - compliance_audit
      - metadata
      title: AssetRecord
    AudienceMetricsInfo:
      properties:
        uoct_hourly_vehicles_avg:
          anyOf:
          - type: integer
          - type: 'null'
          title: Uoct Hourly Vehicles Avg
        mop_tmda_daily_vehicles:
          anyOf:
          - type: integer
          - type: 'null'
          title: Mop Tmda Daily Vehicles
        dtpm_bip_daily_validations:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dtpm Bip Daily Validations
        sectra_occupancy_factor:
          type: number
          title: Sectra Occupancy Factor
          default: 1.42
        weekly_ots_gross:
          type: integer
          title: Weekly Ots Gross
        visibility_index_weight:
          type: number
          title: Visibility Index Weight
        weekly_vac_impacts:
          type: integer
          title: Weekly Vac Impacts
        methodology:
          type: string
          title: Methodology
          default: OPEN_SYNTHETIC_UOCT_ADATRAP_V1
      type: object
      required:
      - weekly_ots_gross
      - visibility_index_weight
      - weekly_vac_impacts
      title: AudienceMetricsInfo
    CampaignSimulationRequest:
      properties:
        campaign_name:
          type: string
          title: Campaign Name
        duration_weeks:
          type: integer
          maximum: 52.0
          minimum: 1.0
          title: Duration Weeks
          default: 4
        exclude_non_compliant_assets:
          type: boolean
          title: Exclude Non Compliant Assets
          default: true
        face_ids:
          items:
            type: string
          type: array
          title: Face Ids
        pricing_strategy:
          anyOf:
          - type: string
            enum:
            - LIST_PRICE
            - CONSERVATIVE_30PCT
            - MARKET_AVERAGE_42PCT
            - STATE_TENDER_55PCT
          - type: 'null'
          title: Pricing Strategy
          default: MARKET_AVERAGE_42PCT
      type: object
      required:
      - campaign_name
      - face_ids
      title: CampaignSimulationRequest
    CampaignSimulationResponse:
      properties:
        campaign_name:
          type: string
          title: Campaign Name
        total_faces_evaluated:
          type: integer
          title: Total Faces Evaluated
        compliant_faces_approved:
          type: integer
          title: Compliant Faces Approved
        rejected_by_ley_21473_risk:
          type: integer
          title: Rejected By Ley 21473 Risk
        rejected_face_ids:
          items:
            type: string
          type: array
          title: Rejected Face Ids
        communes_covered:
          items:
            type: string
          type: array
          title: Communes Covered
        total_ots_gross:
          type: integer
          title: Total Ots Gross
        total_vac_impacts:
          type: integer
          title: Total Vac Impacts
        financial_projection_clp:
          additionalProperties: true
          type: object
          title: Financial Projection Clp
        breakdown_by_commune:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Breakdown By Commune
        breakdown_by_owner:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Breakdown By Owner
      type: object
      required:
      - campaign_name
      - total_faces_evaluated
      - compliant_faces_approved
      - rejected_by_ley_21473_risk
      - rejected_face_ids
      - communes_covered
      - total_ots_gross
      - total_vac_impacts
      - financial_projection_clp
      title: CampaignSimulationResponse
    CommercialPricingInfo:
      properties:
        billing_periodicity:
          type: string
          enum:
          - MONTHLY
          - WEEKLY
          - CAMPAIGN_14D
          title: Billing Periodicity
          default: MONTHLY
        list_price_clp_monthly:
          type: integer
          title: List Price Clp Monthly
        production_cost_clp:
          type: integer
          title: Production Cost Clp
          default: 0
        estimated_net_discount_pct:
          type: number
          title: Estimated Net Discount Pct
          default: 0.42
        estimated_net_price_clp:
          type: integer
          title: Estimated Net Price Clp
        estimated_annual_municipal_tax_clp:
          type: integer
          title: Estimated Annual Municipal Tax Clp
      type: object
      required:
      - list_price_clp_monthly
      - estimated_net_price_clp
      - estimated_annual_municipal_tax_clp
      title: CommercialPricingInfo
    CommuneRM:
      properties:
        commune_code:
          type: string
          title: Commune Code
          description: Código Único Territorial CUT (ej. 13123)
        commune_name:
          type: string
          title: Commune Name
        province_name:
          type: string
          title: Province Name
        ring_tier:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Ring Tier
          description: Anillo operativo RM (1 a 4)
        utm_tax_rate_standard:
          type: number
          title: Utm Tax Rate Standard
          description: Derecho semestral estándar en UTM/m2
        utm_tax_rate_led:
          type: number
          title: Utm Tax Rate Led
          description: Derecho semestral pantallas LED en UTM/m2
        gis_rest_endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Gis Rest Endpoint
      type: object
      required:
      - commune_code
      - commune_name
      - province_name
      - ring_tier
      - utm_tax_rate_standard
      - utm_tax_rate_led
      title: CommuneRM
    ComplianceAuditInfo:
      properties:
        status:
          type: string
          enum:
          - VERIFIED_LEGAL
          - PARTIAL_COMPLIANCE
          - UNREGISTERED_CLANDESTINE
          - ZONING_VIOLATION_RISK
          - EXPIRED_PERMIT
          title: Status
        ley_21473_class:
          type: string
          enum:
          - ELEMENTO_MENOR
          - ELEMENTO_MAYOR
          title: Ley 21473 Class
        dom_permit_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Dom Permit Number
        dom_authorized_area_m2:
          anyOf:
          - type: number
          - type: 'null'
          title: Dom Authorized Area M2
        municipal_patent_rol:
          anyOf:
          - type: string
          - type: 'null'
          title: Municipal Patent Rol
        patent_last_paid_semester:
          anyOf:
          - type: string
          - type: 'null'
          title: Patent Last Paid Semester
        patent_taxed_area_m2:
          anyOf:
          - type: number
          - type: 'null'
          title: Patent Taxed Area M2
        mop_vialidad_itf_resolution:
          anyOf:
          - type: string
          - type: 'null'
          title: Mop Vialidad Itf Resolution
        mma_ds1_lum_certified:
          type: boolean
          title: Mma Ds1 Lum Certified
          default: false
        prc_zone_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Prc Zone Code
        is_exclusive_residential:
          type: boolean
          title: Is Exclusive Residential
          default: false
        distance_to_nearest_hazard_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance To Nearest Hazard M
        permit_expiration_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Permit Expiration Date
        solidary_liability_risk_level:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          title: Solidary Liability Risk Level
        risk_flags:
          items:
            type: string
          type: array
          title: Risk Flags
      type: object
      required:
      - status
      - ley_21473_class
      - solidary_liability_risk_level
      title: ComplianceAuditInfo
    DimensionsInfo:
      properties:
        width_m:
          type: number
          title: Width M
        height_m:
          type: number
          title: Height M
        area_m2:
          type: number
          title: Area M2
      type: object
      required:
      - width_m
      - height_m
      - area_m2
      title: DimensionsInfo
    FaceItem:
      properties:
        face_id:
          type: string
          title: Face Id
        face_label:
          type: string
          title: Face Label
        azimuth_degrees:
          type: integer
          title: Azimuth Degrees
        orientation_cardinal:
          type: string
          title: Orientation Cardinal
        traffic_flow_direction:
          type: string
          title: Traffic Flow Direction
        dimensions:
          $ref: '#/components/schemas/DimensionsInfo'
        technology:
          $ref: '#/components/schemas/TechnologyInfo'
        audience_metrics:
          $ref: '#/components/schemas/AudienceMetricsInfo'
        commercial_pricing:
          $ref: '#/components/schemas/CommercialPricingInfo'
      type: object
      required:
      - face_id
      - face_label
      - azimuth_degrees
      - orientation_cardinal
      - traffic_flow_direction
      - dimensions
      - technology
      - audience_metrics
      - commercial_pricing
      title: FaceItem
    GeoJSONFeature:
      properties:
        type:
          type: string
          const: Feature
          title: Type
          default: Feature
        id:
          type: string
          title: Id
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
        properties:
          additionalProperties: true
          type: object
          title: Properties
      type: object
      required:
      - id
      - geometry
      - properties
      title: GeoJSONFeature
    GeoJSONFeatureCollection:
      properties:
        type:
          type: string
          const: FeatureCollection
          title: Type
          default: FeatureCollection
        total_features:
          type: integer
          title: Total Features
        features:
          items:
            $ref: '#/components/schemas/GeoJSONFeature'
          type: array
          title: Features
      type: object
      required:
      - total_features
      - features
      title: GeoJSONFeatureCollection
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
