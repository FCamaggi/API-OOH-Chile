app = "api-ooh-chile"
primary_region = "scl"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  USE_IN_MEMORY_DB = "true"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
